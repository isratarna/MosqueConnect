<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the saved theme before the first paint. Keep the key in sync with utils/theme.js. -->
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = window.localStorage.getItem("mc-theme");
          var dark = saved === "dark" || (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          theme = dark ? "dark" : "light";
        } catch (error) {
          try { theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (ignored) {}
        }
        var root = document.documentElement;
        root.setAttribute("data-bs-theme", theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <style>
      html[data-bs-theme="dark"] { background-color: #16130f; }
    </style>
    <title>MosqueConnect — Find mosques around you</title>
    <link rel="icon" type="image/png" href="/src/assets/Logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
