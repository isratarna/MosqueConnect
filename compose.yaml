name: mosqueconnect

services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    command: npm run dev --workspace=apps/web -- --host 0.0.0.0
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:${API_PORT:-8000}
      VITE_OPEN_BROWSER: "false"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${API_PORT:-8000}
      FRONTEND_URL: http://localhost:${WEB_PORT:-5173}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-mosqueconnect}
      DB_USERNAME: ${MYSQL_USER:-mosqueconnect}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mosqueconnect}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mosqueconnect}
      MYSQL_USER: ${MYSQL_USER:-mosqueconnect}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mosqueconnect}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
  web_node_modules:
