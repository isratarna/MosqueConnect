name: mosqueconnect

services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    command: npm run dev --workspace=apps/web -- --host 0.0.0.0
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:${API_PORT:-8000}
      VITE_OPEN_BROWSER: "false"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${API_PORT:-8000}
      FRONTEND_URL: http://localhost:${WEB_PORT:-5173}
      # `php artisan serve` uses PHP's built-in server, which handles one request
      # at a time unless it forks workers. The SPA fires several requests per page,
      # so without this they queue and pages take ~10s to load instead of ~0.3s.
      PHP_CLI_SERVER_WORKERS: "8"
      # Log to both: stderr so `docker logs` shows it, and the single-file
      # channel so it also lands in apps/api/storage/logs/laravel.log, which is
      # where the local OTP codes are read from during development.
      LOG_CHANNEL: stack
      LOG_STACK: single,stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-mosqueconnect}
      DB_USERNAME: ${MYSQL_USER:-mosqueconnect}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mosqueconnect}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/var/www/html
      # vendor/ is 8000+ PHP files that never change while developing. Keeping
      # it on a named volume instead of the host bind mount takes it off Docker
      # Desktop's slow filesystem bridge, which is what made every request --
      # even ones returning an empty list -- take seconds. Run
      # `docker compose run --rm api composer install` after changing
      # composer.json/lock; the entrypoint also refreshes it automatically.
      - api_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mosqueconnect}
      MYSQL_USER: ${MYSQL_USER:-mosqueconnect}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mosqueconnect}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
  web_node_modules:
  api_vendor:
