server {
    listen 80;
    server_name mosqueconnect.austattendance.online;

    root /home/s20230204056/laravel/public;
    index index.php;

    access_log /var/log/nginx/s20230204056-access.log;
    error_log  /var/log/nginx/s20230204056-error.log;

    # ---- transfer size -------------------------------------------------
    # nginx's packaged defaults gzip text/html only, so the SPA's CSS and JS
    # went out raw: 342 KB of CSS and 544 KB of entry JS per cold load.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/wasm;

    # ---- static asset caching ------------------------------------------
    # Vite fingerprints every file under /app/assets/, so a given URL can
    # never change contents. Without this each reload re-validated ~25 files.
    location ^~ /app/assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA entry document must never be cached, or a deploy keeps serving
    # the old asset hashes.
    location = /app/index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-s20230204056.sock;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
