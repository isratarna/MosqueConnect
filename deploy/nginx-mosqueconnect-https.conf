server {
    listen 80;
    server_name mosqueconnect.austattendance.online;

    # keep ACME challenges reachable over plain HTTP
    location ^~ /.well-known/ {
        root /home/s20230204056/laravel/public;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mosqueconnect.austattendance.online;

    ssl_certificate     /home/s20230204056/ssl_certs/fullchain.pem;
    ssl_certificate_key /home/s20230204056/ssl_certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /home/s20230204056/laravel/public;
    index index.php;

    access_log /var/log/nginx/s20230204056-access.log;
    error_log  /var/log/nginx/s20230204056-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-s20230204056.sock;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
