; Production tuning for the API container. Unlike the development ini, the
; source tree is baked into the image and never changes at runtime, so OPcache
; can skip timestamp validation entirely.
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

realpath_cache_size=4096k
realpath_cache_ttl=600

expose_php=Off
memory_limit=256M
upload_max_filesize=20M
post_max_size=20M
