; Development tuning for the API container.
;
; `php artisan serve` runs under the CLI SAPI, where OPcache is disabled by
; default. That made every single request recompile the whole framework from
; the bind-mounted source tree, which costs seconds per request on Docker
; Desktop bind mounts (gRPC-FUSE) rather than the milliseconds it costs on a
; native filesystem. Enabling OPcache for the CLI SAPI keeps compiled bytecode
; in shared memory across requests, and the `serve` workers inherit that shared
; memory when they fork.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Hot reloading is preserved: timestamps are re-checked on every request, so an
; edit to app code takes effect immediately. This stays cheap because only the
; ~160 application files are bind-mounted -- vendor/ (8000+ files) is served
; from a named volume on the container's own filesystem. Do not raise
; revalidate_freq: a non-zero value batches the checks, which makes one request
; every N seconds pay for the whole re-stat sweep and reintroduces the stalls.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Resolving paths across the bind mount is the other per-request cost; the
; default 4k realpath cache is far too small for a Laravel application.
realpath_cache_size=4096k
realpath_cache_ttl=600
