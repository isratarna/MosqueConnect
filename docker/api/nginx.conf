# Front-end HTTP server for the API container. Container Apps sends all
# ingress traffic to a single port, so nginx listens on 8080 and hands PHP
# requests to the php-fpm pool running beside it under supervisord.
server {
    listen 8080 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # Laravel's health endpoint; keep it out of the access log so the Container
    # Apps probe does not drown out real traffic.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Never serve dotfiles (.env, .git) even if one ends up in the image.
    location ~ /\. {
        deny all;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr;
}
