# Serves the built React bundle. Vite emits a single-page app, so any path that
# is not a real file has to fall back to index.html for client-side routing.
server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; index.html must never be cached or the
    # browser keeps loading the previous deployment's asset URLs.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr;
}
