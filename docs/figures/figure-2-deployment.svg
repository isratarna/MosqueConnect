<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6b4a"/>
    </marker>
    <marker id="a2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6412"/>
    </marker>
  </defs>
  <rect width="1180" height="800" fill="#ffffff"/>

  <text x="40" y="44" font-size="22" font-weight="600" fill="#15241d">Figure 2 — Deployment and delivery pipeline</text>
  <text x="40" y="66" font-size="13" fill="#5a6a63">GitHub Actions builds every release and ships it to the VPS over SSH; Nginx and PHP-FPM serve it to visitors over HTTPS.</text>

  <!-- BUILD LANE -->
  <rect x="40" y="92" width="470" height="330" rx="10" fill="#f4f8f6" stroke="#c9d6cf"/>
  <text x="60" y="118" font-size="15" font-weight="600" fill="#1f6b4a">Build and release — GitHub Actions</text>
  <text x="60" y="137" font-size="12" fill="#5a6a63">.github/workflows/deploy.yml · runs on every push to main, or manually</text>

  <rect x="60" y="150" width="200" height="54" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="74" y="172" font-size="13" font-weight="600" fill="#15241d">Developer</text>
  <text x="74" y="191" font-size="11.5" fill="#44544d">Pull request merged to main</text>

  <line x1="260" y1="177" x2="320" y2="177" stroke="#1f6b4a" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="322" y="150" width="166" height="54" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="336" y="172" font-size="13" font-weight="600" fill="#15241d">GitHub repository</text>
  <text x="336" y="191" font-size="11.5" fill="#44544d">isratarna/MosqueConnect</text>

  <line x1="405" y1="204" x2="405" y2="226" stroke="#1f6b4a" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="60" y="228" width="428" height="130" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="74" y="250" font-size="13" font-weight="600" fill="#15241d">Deploy job (runner)</text>
  <text x="74" y="272" font-size="11.5" fill="#44544d">1 · PHP 8.4 · composer install --no-dev --optimize-autoloader</text>
  <text x="74" y="290" font-size="11.5" fill="#44544d">2 · npm ci and npm run build → apps/api/public/app</text>
  <text x="74" y="308" font-size="11.5" fill="#44544d">3 · commit SHA written to apps/api/REVISION</text>
  <text x="74" y="326" font-size="11.5" fill="#44544d">4 · pack release.tar.gz (no .env, no tests, no logs)</text>
  <text x="74" y="344" font-size="11.5" fill="#44544d">5 · verify the archive, then scp it to the server</text>

  <rect x="60" y="368" width="428" height="42" rx="8" fill="#fbf7ec" stroke="#e0cfa4"/>
  <text x="74" y="386" font-size="12" font-weight="600" fill="#8a6412">Secrets: SSH_PRIVATE_KEY, VITE_GOOGLE_MAPS_API_KEY</text>
  <text x="74" y="403" font-size="11.5" fill="#5a5241">Stored in GitHub only. The server never runs Composer or npm.</text>

  <!-- VISITOR LANE -->
  <rect x="540" y="92" width="600" height="330" rx="10" fill="#f4f8f6" stroke="#c9d6cf"/>
  <text x="560" y="118" font-size="15" font-weight="600" fill="#1f6b4a">Serving a request</text>

  <rect x="560" y="138" width="166" height="56" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="574" y="160" font-size="13" font-weight="600" fill="#15241d">Visitor browser</text>
  <text x="574" y="179" font-size="11.5" fill="#44544d">Desktop or mobile</text>

  <line x1="726" y1="166" x2="782" y2="166" stroke="#1f6b4a" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="784" y="138" width="200" height="56" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="798" y="160" font-size="13" font-weight="600" fill="#15241d">DNS</text>
  <text x="798" y="179" font-size="11.5" fill="#44544d">mosqueconnect.austattendance.online</text>

  <line x1="884" y1="194" x2="884" y2="222" stroke="#1f6b4a" stroke-width="2" marker-end="url(#a2)"/>
  <text x="896" y="213" font-size="11.5" fill="#44544d">A record → 187.52.122.100</text>

  <rect x="560" y="224" width="560" height="78" rx="8" fill="#ffffff" stroke="#1f6b4a"/>
  <text x="574" y="246" font-size="13" font-weight="600" fill="#15241d">Nginx 1.24 (Ubuntu)</text>
  <text x="574" y="266" font-size="11.5" fill="#44544d">Port 443: TLS 1.2 / 1.3, Let's Encrypt certificate · Port 80: 301 redirect to HTTPS, except /.well-known</text>
  <text x="574" y="284" font-size="11.5" fill="#44544d">Hidden files denied · access and error logs per user</text>

  <path d="M 700 302 L 700 330" stroke="#1f6b4a" stroke-width="2" marker-end="url(#a2)" fill="none"/>
  <path d="M 980 302 L 980 330" stroke="#1f6b4a" stroke-width="2" marker-end="url(#a2)" fill="none"/>

  <rect x="560" y="332" width="280" height="76" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="574" y="354" font-size="12.5" font-weight="600" fill="#15241d">Static files, served directly</text>
  <text x="574" y="374" font-size="11.5" fill="#44544d">/app/assets/* — the built React</text>
  <text x="574" y="390" font-size="11.5" fill="#44544d">bundle, images and styles</text>

  <rect x="856" y="332" width="264" height="76" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="870" y="354" font-size="12.5" font-weight="600" fill="#15241d">Everything else → PHP-FPM 8.4</text>
  <text x="870" y="374" font-size="11.5" fill="#44544d">Dedicated pool socket</text>
  <text x="870" y="390" font-size="11" fill="#44544d">/run/php/php8.4-fpm-s20230204056.sock</text>

  <!-- SERVER BOX -->
  <rect x="40" y="446" width="1100" height="246" rx="10" fill="#eef4f1" stroke="#1f6b4a"/>
  <text x="60" y="474" font-size="15" font-weight="600" fill="#1f6b4a">Virtual private server — 187.52.122.100</text>
  <text x="60" y="494" font-size="12" fill="#44544d">Ubuntu 24.04.5 LTS (kernel 6.8) · 1 vCPU · 3.8 GB RAM · 48 GB disk · user s20230204056 · only ports 22, 80 and 443 reachable from the internet</text>

  <rect x="60" y="508" width="330" height="106" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="74" y="530" font-size="13" font-weight="600" fill="#15241d">Release directory ~/laravel</text>
  <text x="74" y="550" font-size="11.5" fill="#44544d">Laravel application and public/app bundle</text>
  <text x="74" y="568" font-size="11.5" fill="#44544d">.env created once, permissions 600</text>
  <text x="74" y="586" font-size="11.5" fill="#44544d">REVISION holds the deployed commit SHA</text>
  <text x="74" y="604" font-size="11.5" fill="#44544d">www-data gets read access to public/ by ACL</text>

  <line x1="390" y1="561" x2="446" y2="561" stroke="#1f6b4a" stroke-width="2" marker-end="url(#a2)"/>
  <text x="396" y="553" font-size="11" fill="#44544d">SQL</text>

  <rect x="448" y="508" width="310" height="106" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="462" y="530" font-size="13" font-weight="600" fill="#15241d">MySQL — mosqueconnect_db</text>
  <text x="462" y="550" font-size="11.5" fill="#44544d">Shared course database container,</text>
  <text x="462" y="568" font-size="11.5" fill="#44544d">reached on 127.0.0.1:3307 only</text>
  <text x="462" y="586" font-size="11.5" fill="#44544d">User mosqueconnect has privileges</text>
  <text x="462" y="604" font-size="11.5" fill="#44544d">on this one database</text>

  <rect x="776" y="508" width="344" height="106" rx="8" fill="#fbf7ec" stroke="#e0cfa4"/>
  <text x="790" y="530" font-size="13" font-weight="600" fill="#8a6412">On arrival of a release</text>
  <text x="790" y="550" font-size="11.5" fill="#5a5241">unpack into ~/laravel · check .env exists</text>
  <text x="790" y="568" font-size="11.5" fill="#5a5241">refresh permissions and ACLs</text>
  <text x="790" y="586" font-size="11.5" fill="#5a5241">php artisan migrate --force</text>
  <text x="790" y="604" font-size="11.5" fill="#5a5241">link storage · php artisan optimize</text>

  <rect x="60" y="628" width="1060" height="46" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="74" y="648" font-size="12.5" font-weight="600" fill="#15241d">First-time setup: deploy/server-setup.sh (idempotent)</text>
  <text x="74" y="665" font-size="11.5" fill="#44544d">Creates directories and ACLs · creates the database and a restricted database user · writes ~/laravel/.env once with a fresh APP_KEY · installs the Nginx site · reloads Nginx. Run with --https to install the TLS site.</text>

  <path d="M 274 410 C 274 428 274 428 274 444" stroke="#8a6412" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2g)" fill="none"/>
  <text x="286" y="432" font-size="11.5" font-weight="600" fill="#8a6412">scp + ssh with the deploy key</text>

  <text x="40" y="724" font-size="11.5" fill="#6b7a73">The SPA and the API share one origin, so there are no cross-origin requests: Nginx returns the built assets directly, while page and API routes are handled by Laravel through PHP-FPM.</text>
  <text x="40" y="744" font-size="11.5" fill="#6b7a73">Verification: curl -I https://mosqueconnect.austattendance.online and curl .../api/health, whose commit value must equal the newest commit on main.</text>
</svg>
