<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 940" width="1180" height="940" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6b4a"/>
    </marker>
    <marker id="a3s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6412"/>
    </marker>
  </defs>
  <rect width="1180" height="940" fill="#ffffff"/>

  <text x="40" y="44" font-size="22" font-weight="600" fill="#15241d">Figure 3 — Key database tables and relationships</text>
  <text x="40" y="66" font-size="13" fill="#5a6a63">51 migrations create 45 tables. The most important ones are shown; a line marked 1—N means one row on the left has many rows on the right.</text>

  <!-- users column -->
  <rect x="40" y="116" width="256" height="104" rx="8" fill="#eef4f1" stroke="#1f6b4a"/>
  <text x="54" y="138" font-size="14" font-weight="700" fill="#15241d">users</text>
  <text x="54" y="158" font-size="11" fill="#44544d">id · name · phone (unique)</text>
  <text x="54" y="175" font-size="11" fill="#44544d">role: user / mosque_admin / super_admin</text>
  <text x="54" y="192" font-size="11" fill="#44544d">status: active / suspended</text>
  <text x="54" y="209" font-size="11" fill="#44544d">notification preferences, terms accepted</text>

  <rect x="40" y="238" width="256" height="42" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="54" y="257" font-size="12.5" font-weight="600" fill="#15241d">phone_otp_verifications</text>
  <text x="54" y="273" font-size="11" fill="#44544d">phone · code · expires_at</text>

  <rect x="40" y="290" width="256" height="42" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="54" y="309" font-size="12.5" font-weight="600" fill="#15241d">personal_access_tokens</text>
  <text x="54" y="325" font-size="11" fill="#44544d">Sanctum API tokens</text>

  <rect x="40" y="342" width="256" height="56" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="54" y="361" font-size="12.5" font-weight="600" fill="#15241d">followers</text>
  <text x="54" y="377" font-size="11" fill="#44544d">user_id · mosque_id</text>
  <text x="54" y="392" font-size="11" fill="#8a6412">unique (user_id, mosque_id)</text>

  <rect x="40" y="408" width="256" height="56" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="54" y="427" font-size="12.5" font-weight="600" fill="#15241d">notifications</text>
  <text x="54" y="443" font-size="11" fill="#44544d">user_id · mosque_id (nullable)</text>
  <text x="54" y="458" font-size="11" fill="#44544d">type · reference · read_at</text>

  <rect x="40" y="474" width="256" height="56" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="54" y="493" font-size="12.5" font-weight="600" fill="#15241d">mosque_members</text>
  <text x="54" y="509" font-size="11" fill="#44544d">mosque_id · user_id · team role</text>
  <text x="54" y="524" font-size="11" fill="#8a6412">unique (mosque_id, user_id)</text>

  <rect x="40" y="540" width="256" height="56" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="54" y="559" font-size="12.5" font-weight="600" fill="#15241d">verification_requests</text>
  <text x="54" y="575" font-size="11" fill="#44544d">user_id · mosque_id · documents</text>
  <text x="54" y="590" font-size="11" fill="#44544d">status, reviewed by super admin</text>

  <rect x="40" y="606" width="256" height="56" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="54" y="625" font-size="12.5" font-weight="600" fill="#15241d">mosque_suggestions</text>
  <text x="54" y="641" font-size="11" fill="#44544d">new mosques proposed by users</text>
  <text x="54" y="656" font-size="11" fill="#44544d">mosque_edit_suggestions: corrections</text>

  <line x1="306" y1="168" x2="306" y2="634" stroke="#1f6b4a" stroke-width="1.6"/>
  <line x1="296" y1="168" x2="306" y2="168" stroke="#1f6b4a" stroke-width="1.6"/>
  <line x1="306" y1="259" x2="296" y2="259" stroke="#1f6b4a" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="306" y1="311" x2="296" y2="311" stroke="#1f6b4a" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="306" y1="370" x2="296" y2="370" stroke="#1f6b4a" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="306" y1="436" x2="296" y2="436" stroke="#1f6b4a" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="306" y1="502" x2="296" y2="502" stroke="#1f6b4a" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="306" y1="568" x2="296" y2="568" stroke="#1f6b4a" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="306" y1="634" x2="296" y2="634" stroke="#1f6b4a" stroke-width="1.6" marker-end="url(#a3)"/>
  <text x="318" y="300" font-size="11.5" font-weight="600" fill="#1f6b4a" transform="rotate(90 318 300)">one user — many rows (1—N)</text>

  <!-- mosques column -->
  <rect x="352" y="116" width="250" height="168" rx="8" fill="#eef4f1" stroke="#1f6b4a"/>
  <text x="366" y="138" font-size="14" font-weight="700" fill="#15241d">mosques</text>
  <text x="366" y="158" font-size="11" fill="#44544d">id · name · address</text>
  <text x="366" y="175" font-size="11" fill="#44544d">latitude · longitude  (Haversine search)</text>
  <text x="366" y="192" font-size="11" fill="#44544d">district · area</text>
  <text x="366" y="209" font-size="11" fill="#44544d">facilities, photo, rating fields</text>
  <text x="366" y="226" font-size="11" fill="#44544d">verification state</text>
  <text x="366" y="243" font-size="11" fill="#8a6412">owner_id → users.id</text>
  <text x="366" y="266" font-size="11" fill="#44544d">mosque_facilities: facility rows</text>

  <text x="352" y="310" font-size="12.5" font-weight="700" fill="#1f6b4a">Platform and administration</text>

  <rect x="352" y="320" width="250" height="40" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="366" y="338" font-size="12" font-weight="600" fill="#15241d">content_reports</text>
  <text x="366" y="353" font-size="11" fill="#44544d">reported content, moderation status</text>

  <rect x="352" y="368" width="250" height="40" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="366" y="386" font-size="12" font-weight="600" fill="#15241d">admin_audit_logs</text>
  <text x="366" y="401" font-size="11" fill="#44544d">who changed what, and when</text>

  <rect x="352" y="416" width="250" height="40" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="366" y="434" font-size="12" font-weight="600" fill="#15241d">system_settings · broadcasts</text>
  <text x="366" y="449" font-size="11" fill="#44544d">platform settings, Eid season, notices</text>

  <rect x="352" y="464" width="250" height="40" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="366" y="482" font-size="12" font-weight="600" fill="#15241d">mosque_daily_stats</text>
  <text x="366" y="497" font-size="11" fill="#44544d">per-mosque daily counts</text>

  <rect x="352" y="512" width="250" height="40" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="366" y="530" font-size="12" font-weight="600" fill="#15241d">journey_plans</text>
  <text x="366" y="545" font-size="11" fill="#44544d">saved prayer-aware journeys</text>

  <rect x="352" y="560" width="250" height="40" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="366" y="578" font-size="12" font-weight="600" fill="#15241d">contact_messages</text>
  <text x="366" y="593" font-size="11" fill="#44544d">public contact form</text>

  <line x1="352" y1="200" x2="320" y2="200" stroke="#8a6412" stroke-width="1.6" marker-end="url(#a3s)"/>
  <text x="330" y="196" font-size="10.5" font-weight="600" fill="#8a6412" transform="rotate(90 330 196)">owner_id</text>

  <!-- schedules column -->
  <rect x="640" y="116" width="240" height="44" rx="8" fill="#fbf7ec" stroke="#e0cfa4"/>
  <text x="654" y="136" font-size="12.5" font-weight="700" fill="#8a6412">Schedules and profile</text>
  <text x="654" y="152" font-size="10" fill="#5a5241">every row has mosque_id → mosques.id</text>

  <rect x="640" y="168" width="240" height="46" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="654" y="187" font-size="12.5" font-weight="600" fill="#15241d">prayer_times</text>
  <text x="654" y="204" font-size="11" fill="#44544d">five daily adhan and jamaat times</text>

  <rect x="640" y="224" width="240" height="46" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="654" y="243" font-size="12.5" font-weight="600" fill="#15241d">jumuah_sessions</text>
  <text x="654" y="260" font-size="11" fill="#44544d">Friday khutbah and jamaat</text>

  <rect x="640" y="280" width="240" height="46" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="654" y="299" font-size="12.5" font-weight="600" fill="#15241d">prayer_schedule_periods</text>
  <text x="654" y="316" font-size="11" fill="#44544d">date ranges with their own times</text>

  <rect x="640" y="336" width="240" height="46" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="654" y="355" font-size="12.5" font-weight="600" fill="#15241d">ramadan_timings</text>
  <text x="654" y="372" font-size="11" fill="#44544d">sehri, iftar and taraweeh</text>

  <rect x="640" y="392" width="240" height="46" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="654" y="411" font-size="12.5" font-weight="600" fill="#15241d">eid_jamaats</text>
  <text x="654" y="428" font-size="11" fill="#8a6412">unique (mosque_id, eid, year, sequence)</text>

  <rect x="640" y="448" width="240" height="46" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="654" y="467" font-size="12.5" font-weight="600" fill="#15241d">mosque_photos</text>
  <text x="654" y="484" font-size="11" fill="#44544d">gallery images · uploaded_by</text>

  <rect x="640" y="504" width="240" height="46" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="654" y="523" font-size="12.5" font-weight="600" fill="#15241d">mosque_reviews</text>
  <text x="654" y="540" font-size="11" fill="#8a6412">unique (mosque_id, user_id)</text>

  <path d="M 602 150 L 620 150 L 620 138 L 638 138" stroke="#1f6b4a" stroke-width="1.8" fill="none" marker-end="url(#a3)"/>
  <text x="606" y="172" font-size="11" font-weight="600" fill="#1f6b4a">1—N</text>

  <!-- content column -->
  <rect x="908" y="116" width="232" height="44" rx="8" fill="#fbf7ec" stroke="#e0cfa4"/>
  <text x="922" y="136" font-size="12.5" font-weight="700" fill="#8a6412">Content and community</text>
  <text x="922" y="152" font-size="11" fill="#5a5241">each belongs to a mosque (mosque_id)</text>

  <rect x="908" y="168" width="232" height="44" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="922" y="187" font-size="12.5" font-weight="600" fill="#15241d">announcements</text>
  <text x="922" y="203" font-size="11" fill="#44544d">urgency, schedule, expiry, pin</text>

  <rect x="908" y="222" width="232" height="44" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="922" y="241" font-size="12.5" font-weight="600" fill="#15241d">events</text>
  <text x="922" y="257" font-size="11" fill="#44544d">capacity, recurrence rules</text>

  <rect x="930" y="276" width="210" height="44" rx="8" fill="#f7faf8" stroke="#c9d6cf"/>
  <text x="944" y="295" font-size="12" font-weight="600" fill="#15241d">event_registrations</text>
  <text x="944" y="311" font-size="11" fill="#8a6412">unique (event_id, user_id)</text>

  <rect x="908" y="330" width="232" height="44" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="922" y="349" font-size="12.5" font-weight="600" fill="#15241d">campaigns</text>
  <text x="922" y="365" font-size="11" fill="#44544d">goal, raised amount, updates</text>

  <rect x="930" y="384" width="210" height="44" rx="8" fill="#f7faf8" stroke="#c9d6cf"/>
  <text x="944" y="403" font-size="12" font-weight="600" fill="#15241d">campaign_donations</text>
  <text x="944" y="419" font-size="11" fill="#44544d">manual pledges, confirmed by admin</text>

  <rect x="908" y="438" width="232" height="44" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="922" y="457" font-size="12.5" font-weight="600" fill="#15241d">blood_requests</text>
  <text x="922" y="473" font-size="11" fill="#44544d">group, urgency, closed reason</text>

  <rect x="930" y="492" width="210" height="40" rx="8" fill="#f7faf8" stroke="#c9d6cf"/>
  <text x="944" y="510" font-size="12" font-weight="600" fill="#15241d">blood_request_responses</text>
  <text x="944" y="525" font-size="11" fill="#44544d">volunteers who replied</text>

  <rect x="908" y="542" width="232" height="44" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="922" y="561" font-size="12.5" font-weight="600" fill="#15241d">volunteer_opportunities</text>
  <text x="922" y="577" font-size="11" fill="#44544d">roles a mosque needs filled</text>

  <rect x="930" y="596" width="210" height="40" rx="8" fill="#f7faf8" stroke="#c9d6cf"/>
  <text x="944" y="614" font-size="12" font-weight="600" fill="#15241d">volunteer_applications</text>
  <text x="944" y="629" font-size="11" fill="#44544d">applicants and attendance</text>

  <rect x="908" y="646" width="232" height="40" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="922" y="664" font-size="12.5" font-weight="600" fill="#15241d">lost_found_items</text>
  <text x="922" y="679" font-size="11" fill="#44544d">lost and found notices</text>

  <rect x="908" y="696" width="232" height="40" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="922" y="714" font-size="12.5" font-weight="600" fill="#15241d">complaints</text>
  <text x="922" y="729" font-size="11" fill="#44544d">raised to the mosque team</text>

  <rect x="908" y="746" width="232" height="40" rx="8" fill="#ffffff" stroke="#c9d6cf"/>
  <text x="922" y="764" font-size="12.5" font-weight="600" fill="#15241d">goods_donations</text>
  <text x="922" y="779" font-size="11" fill="#44544d">pledges of goods, not money</text>

  <path d="M 602 140 L 616 140 L 616 102 L 1000 102 L 1000 114" stroke="#1f6b4a" stroke-width="1.8" fill="none" marker-end="url(#a3)"/>
  <text x="1008" y="99" font-size="11" font-weight="600" fill="#1f6b4a">1—N</text>

  <line x1="924" y1="266" x2="924" y2="296" stroke="#1f6b4a" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="924" y1="374" x2="924" y2="404" stroke="#1f6b4a" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="924" y1="482" x2="924" y2="510" stroke="#1f6b4a" stroke-width="1.6" marker-end="url(#a3)"/>
  <line x1="924" y1="586" x2="924" y2="614" stroke="#1f6b4a" stroke-width="1.6" marker-end="url(#a3)"/>

  <!-- legend -->
  <rect x="40" y="800" width="840" height="100" rx="10" fill="#f4f8f6" stroke="#c9d6cf"/>
  <text x="58" y="824" font-size="13" font-weight="700" fill="#1f6b4a">How to read this figure</text>
  <text x="58" y="845" font-size="11.5" fill="#44544d">Green lines marked 1—N point from a parent row to the many rows that reference it. Indented boxes on the right are child tables of the box above them.</text>
  <text x="58" y="864" font-size="11.5" fill="#44544d">Every table in the two right-hand columns carries mosque_id. Tables that record who acted — registrations, donations, responses, applications, reviews — also carry user_id.</text>
  <text x="58" y="883" font-size="11.5" fill="#8a6412">Gold text marks a database-level unique constraint, which is what stops duplicate follows, duplicate event registrations and duplicate reviews.</text>
</svg>
